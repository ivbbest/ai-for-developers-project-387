name: opencode-schedule

# Ночная проверка деплоя: сырые данные собирает обычный шаг (Lighthouse CLI),
# агент превращает report.json в markdown-отчёт и issue по находкам.
# Cron 03:00 UTC = 06:00 МСК: не чаще раза в сутки (D8), утром команда читает
# отчёт. workflow_dispatch рядом — ручной прогон без ожидания ночи.
# APP_URL — repository variable (адрес публичный, не секрет).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  check:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    # 20 не хватило на разбор полного report.json (dispatch 33958460867 убит
    # таймаутом); с дайджестом шаг агента короче, запас — на холодный старт
    timeout-minutes: 30
    concurrency:
      group: opencode-schedule
      cancel-in-progress: false
    steps:
      - name: Guard APP_URL
        run: |
          test -n "${{ vars.APP_URL }}" || {
            echo "::error::APP_URL не задана: Settings → Secrets and variables → Actions → Variables. Без адреса отчёт не имеет смысла"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Warm-up (Render free-tier холодный 30-60 с)
        env:
          URL: ${{ vars.APP_URL }}
        run: |
          # нормализация: переменная могла быть задана с завершающим слэшем,
          # а Express не матчит «//api/...» — режем слэш здесь, а не в настройке
          BASE="${URL%/}"
          curl -sL --retry 3 --retry-delay 30 "$BASE" -o /dev/null
          # best-effort: site-down должен дойти до агента как «замер не снят»,
          # а не валить job здесь (замечание ревью PR #20, inline L46);
          # настоящий гейт замера — Lighthouse с continue-on-error ниже
          curl -fsS "$BASE/api/event-types" | head -c 200 || \
            echo "::warning::API не ответил — warm-up продолжаем, решение за Lighthouse"

      - name: Lighthouse
        # continue-on-error осознанный: site-down должен превратиться в
        # текстовый отчёт «проверка не удалась», а не красный прогон без
        # объяснений (утренняя команда читает issue, а не логи). Без этого
        # флага job прерывался бы здесь и `if: success()` на агенте был бы
        # тривиально правдой (замечание ревью PR #20)
        continue-on-error: true
        run: |
          npx lighthouse "${{ vars.APP_URL }}" \
            --output=json --output-path=report.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --max-wait-for-load=60000

      - name: Digest report
        # агент на big-pickle не успевает разобрать многмегабайтный report.json
        # за таймаут job (факт: dispatch 33958460867 убит на 20 мин). Дайджест
        # — категории + проваленные аудиты (score < 0.9) с короткими полями:
        # килобайты вместо мегабайт, тот же смысл для анализа
        if: hashFiles('report.json') != ''
        run: |
          jq '{
            fetched: .fetchTime, url: .finalDisplayedUrl,
            categories: .categories | map_values({score: .score, title: .title}),
            audits: [.audits | to_entries[]
              | select(.value.score != null and .value.score < 0.9)
              | {id: .key, title: .value.title, score: .value.score,
                 numericValue: .value.numericValue,
                 displayValue: .value.displayValue,
                 description: (.value.description | .[0:200])}]
          }' report.json > report-digest.json
          wc -c report.json report-digest.json

      - name: Run opencode report
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # gh CLI внутри шага не аутентифицирован без явного токена (факт
          # dispatch 33959681028: агент не смог создать issue и в обход
          # открыл PR с отчётом); issues:write из D7 раскрывается только здесь
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: anomalyco/opencode/github@16747470f976aca3d362ad730bcd3fe82ecc2c9a # v1.18.29
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Если файла report-digest.json нет (замер не снят: деплой недоступен
            или Lighthouse упал) — не выдумывай анализ: создай или обнови issue
            с меткой perf-report текстом «ночная проверка не состоялась, замер
            не снят» и остановись.
            Иначе: проанализируй report-digest.json — дайджест Lighthouse-замера
            продакшен-деплоя этого проекта (категории и проваленные аудиты
            score < 0.9; полный report.json не читай, он огромный). Категории:
            Performance / Accessibility / Best Practices. Для каждой из 3
            главных проблем: что именно замерено, почему это болит пользователю
            календаря звонков, что делать. Сохрани вывод в perf-report.md в
            рабочем каталоге — файл заберёт шаг публикации артефактов.
            Ничего не коммить, не пушь и PR не открывай: отчёт живёт в
            артефактах прогона.
            Затем по находкам создай issue командой `gh issue create` с меткой
            perf-report и текстом «что делаем» (репозиторий и автор уже в
            окружении gh); если открытый issue с меткой perf-report уже есть —
            добавь ему комментарий со свежими цифрами (`gh issue comment`),
            новый не создавай.

      - name: Working tree cleanliness gate
        # гейт причины, а не списка имён (ревью Р4): пост-обработка экшена
        # коммитит рабочий каталог и может открыть PR с любым новым файлом
        # (факты #23/#26); .gitignore закрывает известные имена, этот шаг
        # ловит неизвестные: неигнорируемые изменения после шага отчёта = красный
        run: |
          dirty="$(git status --porcelain)"
          test -z "$dirty" || {
            echo "::error::агент оставил незакоммиченные изменения — артефакты прогона не должны попадать в git"
            echo "$dirty"
            exit 1
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report-${{ github.run_number }}
          path: |
            report.json
            report-digest.json
            perf-report.md
          if-no-files-found: warn
